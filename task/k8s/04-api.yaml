# The Go API itself: 2 copies (replicas) behind one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deals-api
  namespace: deals
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deals-api
  template:
    metadata:
      labels:
        app: deals-api
    spec:
      # Wait for MongoDB and Redis before starting (the app panics if they're down).
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongodb 27017 && nc -z redis 6379; do echo waiting for db; sleep 2; done"]
      containers:
        - name: api
          # Image pushed to MicroK8s' built-in registry (see DEPLOY-K8S.md).
          image: localhost:32000/deals-api:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: REDIS_URL
              value: redis:6379
            - name: MONGODB_LOCAL_URI
              valueFrom:
                secretKeyRef:
                  name: deals-secrets
                  key: MONGODB_LOCAL_URI
          readinessProbe:
            httpGet: { path: /api/healthchecker, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthchecker, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# NodePort exposes the API on your machine at http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: deals-api
  namespace: deals
spec:
  type: NodePort
  selector:
    app: deals-api
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
