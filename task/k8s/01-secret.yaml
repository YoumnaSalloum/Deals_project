# Secrets hold passwords/connection strings so they are not baked into the image.
# Change these values for anything beyond local testing.
apiVersion: v1
kind: Secret
metadata:
  name: deals-secrets
  namespace: deals
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: password123
  # "mongodb" here is the name of the MongoDB Service below (Kubernetes DNS).
  MONGODB_LOCAL_URI: mongodb://root:password123@mongodb:27017/?authSource=admin
